[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.1.13"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.36.0",
    "torch==2.10.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.36.0"

[tool.flwr.app.components]
serverapp = "FL_EnergyForecasting.server_app:app"
clientapp = "FL_EnergyForecasting.client_app:app"


[tool.flwr.app.config]
num-server-rounds = 10
fraction-train = 1.0
fraction-evaluate = 1.0
local-epochs = 10
batch-size = 64
learning-rate = 0.001
num-buildings = 2
# Forecasting setup: seq-len past hours in, horizon future hours out.
seq-len = 168
horizon = 36
# Absolute paths: Flower runs the apps from a copy under ~/.flwr/apps/.
# Change these to your own clone's location.
data-dir = "/home/zahra/fl-school-2026/quickstart-pytorch/Data"
output-dir = "/home/zahra/fl-school-2026/quickstart-pytorch/results"

